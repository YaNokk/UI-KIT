name: UI Tests

on:
  pull_request:
  push:

jobs:
  storybook-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run motion:check
      - run: npx playwright install --with-deps chromium
      - name: Verify workspace test resolution
        run: npm run workspace-test-resolution:check
      - name: Run Choice Controls verification for ${{ github.sha }}
        run: npm run choice-controls:verify
      - name: Upload Choice Controls Storybook evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choice-controls-storybook-${{ github.sha }}
          path: |
            .artifacts/choice-controls-storybook-report.json
            .artifacts/choice-controls-storybook-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run Select and MultiSelect verification for ${{ github.sha }}
        run: npm run select-multiselect:verify
      - name: Run InternationalPhoneInput verification for ${{ github.sha }}
        run: npm run international-phone-input:verify
      - name: Run Textarea verification for ${{ github.sha }}
        run: npm run textarea:verify
      - run: npm run test:storybook
      - run: npm run build-storybook
      - run: npm run build
      - run: npm run pack:check
      - run: npm run consumer:test
      - run: npm run tree-shaking:test
